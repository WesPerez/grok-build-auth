name: Verify targeted Grok reauthorization

on:
  push:
    paths:
      - scripts/reauthorize_grok2api_account.py
      - tests/test_grok2api_reauthorization.py
      - .github/workflows/reauthorization.yml
  pull_request:
    paths:
      - scripts/reauthorize_grok2api_account.py
      - tests/test_grok2api_reauthorization.py
      - .github/workflows/reauthorization.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_grok2api_reauthorization.py -p no:cacheprovider
