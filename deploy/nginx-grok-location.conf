# Add inside the target HTTPS server block after replacing placeholders.
location = /grok { return 301 /grok/; }

location /grok/ {
    proxy_pass http://<console-loopback-host>:<console-port>/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /grok;
    auth_basic "Grok Batch Console";
    auth_basic_user_file /etc/nginx/.htpasswd;
}
